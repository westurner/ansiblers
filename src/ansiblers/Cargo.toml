[workspace]
resolver = "2"
members = [
    "crates/ansiblers-core",
    "crates/ansiblers-parser",
    "crates/ansiblers-inventory",
    "crates/ansiblers-vars",
    "crates/ansiblers-templates",
    "crates/ansiblers-executor",
    "crates/ansiblers-modules",
    "crates/ansiblers-playbook",
    "crates/ansiblers-molecule",
    "crates/ansiblers-compat",
    "crates/ansiblers-sandbox",
    "crates/ansiblers-roles",
    "crates/ansiblers-build",
    "crates/ansiblers-test",
    "tests",
]

[workspace.package]
edition = "2021"
rust-version = "1.70"
license = "GPL-3.0-or-later"
repository = "https://github.com/westurner/ansiblers"
authors = ["ansiblers contributors"]

[workspace.dependencies]
# Internal crates
ansiblers-core = { path = "crates/ansiblers-core" }
ansiblers-parser = { path = "crates/ansiblers-parser" }
ansiblers-inventory = { path = "crates/ansiblers-inventory" }
ansiblers-vars = { path = "crates/ansiblers-vars" }
ansiblers-templates = { path = "crates/ansiblers-templates" }
ansiblers-roles = { path = "crates/ansiblers-roles" }
ansiblers-executor = { path = "crates/ansiblers-executor" }
ansiblers-modules = { path = "crates/ansiblers-modules" }
ansiblers-molecule = { path = "crates/ansiblers-molecule" }
ansiblers-compat = { path = "crates/ansiblers-compat" }
ansiblers-build = { path = "crates/ansiblers-build" }
ansiblers-it = { path = "tests" }

# Template engine (workspace member symlinked in src/)
jinja2rs = { path = "../jinja2rs" }
minijinja = { path = "../minijinja/minijinja", features = [
    "builtins",
    "debug",
    "deserialization",
    "macros",
    "multi_template",
    "serde",
    "loader",
] }
minijinja-contrib = { path = "../minijinja/minijinja-contrib", features = [
    "pycompat",
] }

# Python interop (required by jinja2rs)
pyo3 = { version = "0.22", features = [] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
regex = "1"
fancy-regex = "0.18"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = { version = "2", features = ["serde"] }

# Testing
rstest = "0.23"
insta = { version = "1", features = ["yaml", "json"] }
mockall = "0.13"
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package.insta]
opt-level = 3
